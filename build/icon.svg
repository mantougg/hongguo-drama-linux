<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="iconGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E95420" />
      <stop offset="100%" stop-color="#77216F" />
    </linearGradient>
    <linearGradient id="iconGradientRev" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#77216F" />
      <stop offset="60%" stop-color="#E95420" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2C001E" />
      <stop offset="100%" stop-color="#5E2750" />
    </linearGradient>
    <linearGradient id="sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.35" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20.8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>



  <!-- Short Video Motion Dual Arcs & Play Symbol -->
  <g id="ShortVideoGlyph">
    <!-- Arc 1 -->
    <path d="M 675.44 832.76 A 55.00 55.00 0 0 1 725.38 930.77 A 470 470 0 0 1 93.23 298.62 A 55.00 55.00 0 0 1 191.24 348.56 A 360 360 0 0 0 675.44 832.76 Z" fill="url(#iconGradient)" />
    <!-- Arc 2 -->
    <path d="M 348.56 191.24 A 55.00 55.00 0 0 1 298.62 93.23 A 470 470 0 0 1 930.77 725.38 A 55.00 55.00 0 0 1 832.76 675.44 A 360 360 0 0 0 348.56 191.24 Z" fill="url(#iconGradientRev)" />
    <!-- Center Play Button with Optical Centering -->
    <path d="M 439.98 372.00 L 621.98 489.60 Q 663.98 512.00 621.98 534.40 L 439.98 652.00 Q 417.58 652.00 417.58 618.40 L 417.58 405.60 Q 417.58 372.00 439.98 372.00 Z" fill="url(#iconGradient)" />
  </g>
</svg>